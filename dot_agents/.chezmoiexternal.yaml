# External agent resources managed by chezmoi

## Hooks

# Claude Code Japanese Guard (https://github.com/minorun365/claude-code-japanese-guard)
# The hook runs on every agent turn, so it is pinned to a reviewed commit and
# its checksum. Update both by hand to take a new upstream release.
hooks/japanese-guard.py:
  type: file
  url: https://raw.githubusercontent.com/minorun365/claude-code-japanese-guard/e68864a6709768e14d437800ba1bad1cea3cd1a8/hooks/japanese-guard.py
  checksum:
    sha256: "42a77c34a47a88fcfa2106252c7007f479539eef786c6cab91c0330f0e915547"
  executable: true

## Skills not compatible with npx skills


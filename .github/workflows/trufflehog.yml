name: TruffleHog

on:
  schedule:
    - cron: "57 19 * * 0"  # Every Monday at 04:57 JST (19:57 UTC Sun)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: trufflesecurity/trufflehog@64d939a56362f519781c53ea09b27f8d1dc0140a  # v3.97.6
        with:
          base: ""
          head: main
          extra_args: --exclude-detectors=lob --results=verified,unknown

name: Dependabot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: Review the Dependabot PR
        uses: rewse/actions/dependabot-review@b74841cd9d858e4ce5da13517ad583f296039738  # v1.1.4
        with:
          app-client-id: ${{ secrets.DEPENDABOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          kiro-api-key: ${{ secrets.KIRO_API_KEY }}

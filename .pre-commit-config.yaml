repos:
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc  # frozen: v1.7.12.25
    hooks:
      - id: actionlint
        exclude: \.tmpl$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-dependabot
        exclude: \.tmpl$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        exclude: \.tmpl$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: \.tmpl$
        exclude_types: [zsh]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        exclude: \.tmpl$
        types_or: [python, pyi]
      - id: ruff-format
        exclude: \.tmpl$
        types_or: [python, pyi]
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: a11caebebdbf797e1e96611123db279b334a7675  # frozen: 1.40.2
    hooks:
      - id: basedpyright
        exclude: \.tmpl$
        additional_dependencies: [beautifulsoup4]

repos:
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc  # frozen: v1.7.12.25
    hooks:
      - id: actionlint
        exclude: \.tmpl$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
    hooks:
      - id: check-dependabot
        exclude: \.tmpl$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        exclude: \.tmpl$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: \.tmpl$
        exclude_types: [zsh]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # frozen: v0.17.0
    hooks:
      - id: ruff-check
        exclude: \.tmpl$
        types_or: [python, pyi]
      - id: ruff-format
        exclude: \.tmpl$
        types_or: [python, pyi]
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: a11caebebdbf797e1e96611123db279b334a7675  # frozen: 1.40.2
    hooks:
      - id: basedpyright
        exclude: \.tmpl$
        additional_dependencies: [beautifulsoup4]
